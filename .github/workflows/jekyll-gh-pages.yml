name: Build Reportly AI Android App

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download project
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract Android project
    run: |
      unzip -q reportly-android-project.zip -d extracted

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK components
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build APK
    working-directory: extracted/reportly-android
    run: gradle assembleDebug

  - name: Save APK
    uses: actions/upload-artifact@v4
    with:
      name: reportly-ai-apk
      path: extracted/reportly-android/app/build/outputs/apk/debug/app-debug.apk
